SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    r3 = r3
    r4 = r4
    t1 = t1
    t2 = t2
    q1 = q1
    s1 = s1
    s2 = s2
    c1 = c1

    Tenants  = {t1, t2}
    Clients  = {c1}
    Requests = {r1, r2, r3, r4}
    Queries  = {q1}
    Workers  = {w1, w2}
    Blobs    = {b1, b2, b3, b4}

    MaxSnapshot = 2
    MaxAttempts = 2
    MaxCrashes  = 0
    MaxTimeouts = 0

    FlightPopulatesCache  = FALSE
    MutantSkipTenantCheck = FALSE

    RequestedTenantOf     <- MCRequestedTenantOf
    AuthenticatedTenantOf <- MCAuthenticatedTenantOf
    QueryOf               <- MCQueryOf
    ClientOf              <- MCClientOf
    ProtocolOf            <- MCProtocolOf
    SecurityContextOf     <- MCSecurityContextOf

\* Background processes idle forever, so quiescence is not a real deadlock.
\* Stuck work is caught by the liveness properties instead.
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    TenantBinding
    RLSEnforcement
    UnauthorizedIsInert
    MismatchRejected
    TenantIsolation
    DeliveredResultIntegrity
    ClaimCheckIntegrity
    BlobPtrIffResultState
    NoSharedBlobPointer
    BlobPoolConsistency
    StagedBlobWellFormed
    CacheIntegrity
    CacheFreshness
    ExactlyOnceCommit
    FailedImpliesExhausted
    LeaseOwnership
    QueueConsistency
    FlightIsLocal
    SnapshotBound

PROPERTIES
    EpochMonotonic
    SnapshotNeverChanges
    CatalogMonotonic
    TerminalAbsorbing
    CommitMonotonic
    DeliveryImmutable
    LiveTermination
    ClientsComplete
    GCReclaimsGarbage
