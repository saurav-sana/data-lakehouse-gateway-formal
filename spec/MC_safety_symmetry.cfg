SPECIFICATION Spec

CONSTANTS
    r1 = r1
    r2 = r2
    t1 = t1
    t2 = t2
    q1 = q1
    s1 = s1
    s2 = s2
    c1 = c1
    w1 = w1
    w2 = w2
    b1 = b1
    b2 = b2
    p1 = p1
    p2 = p2

    Tenants    = {t1, t2}
    Clients    = {c1}
    Requests   = {r1, r2}
    Queries    = {q1}
    SecCtxs    = {s1, s2}
    Workers    = {w1, w2}
    Blobs      = {b1, b2}
    ProxyNodes = {p1, p2}

    MaxSnapshot = 2
    MaxAttempts = 2
    MaxCrashes  = 1
    MaxTimeouts = 1
    ScaleOutThreshold = 1

    FlightPopulatesCache  = TRUE
    MutantSkipTenantCheck = FALSE

    RequestedTenantOf     <- MCRequestedTenantOf
    AuthenticatedTenantOf <- MCAuthenticatedTenantOf
    QueryOf               <- MCQueryOf
    ClientOf              <- MCClientOf
    ProtocolOf            <- MCProtocolOf
    SecurityContextOf     <- MCSecurityContextOf

SYMMETRY MCSymmetry

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    TenantBinding
    RLSEnforcement
    UnauthorizedIsInert
    MismatchRejected
    TenantIsolation
    DeliveredResultIntegrity
    ClaimCheckIntegrity
    BlobPtrIffResultState
    NoSharedBlobPointer
    BlobPoolConsistency
    StagedBlobWellFormed
    CacheIntegrity
    CacheFreshness
    ExactlyOnceCommit
    FailedImpliesExhausted
    LeaseOwnership
    QueueConsistency
    FlightIsLocal
    SnapshotBound