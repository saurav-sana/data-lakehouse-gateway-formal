SPECIFICATION Spec

CONSTANTS
    r1 = r1
    t1 = t1
    q1 = q1
    s1 = s1
    c1 = c1
    w1 = w1
    w2 = w2
    b1 = b1
    b2 = b2
    p1 = p1

    Tenants    = {t1}
    Clients    = {c1}
    Requests   = {r1}
    Queries    = {q1}
    SecCtxs    = {s1}
    Workers    = {w1, w2}
    Blobs      = {b1, b2}
    ProxyNodes = {p1}

    MaxSnapshot = 1
    MaxAttempts = 2
    MaxCrashes  = 0
    MaxTimeouts = 1
    ScaleOutThreshold = 1

    FlightPopulatesCache  = FALSE
    MutantSkipTenantCheck = FALSE

    RequestedTenantOf     <- MCRequestedTenantOf
    AuthenticatedTenantOf <- MCAuthenticatedTenantOf
    QueryOf               <- MCQueryOf
    ClientOf              <- MCClientOf
    ProtocolOf            <- MCProtocolOf
    SecurityContextOf     <- MCSecurityContextOf

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    BlobPoolConsistency
    ClaimCheckIntegrity
    BlobPtrIffResultState
    ExactlyOnceCommit