SPECIFICATION Spec

CONSTANTS
    r1 = r1
    t1 = t1
    q1 = q1
    s1 = s1
    c1 = c1
    w1 = w1
    b1 = b1
    p1 = p1

    Tenants    = {t1}
    Clients    = {c1}
    Requests   = {r1}
    Queries    = {q1}
    SecCtxs    = {s1}
    Workers    = {w1}
    Blobs      = {b1}
    ProxyNodes = {p1}

    MaxSnapshot = 2             \* Allows ETL to step to 2
    MaxAttempts = 1
    MaxCrashes  = 0
    MaxTimeouts = 0
    ScaleOutThreshold = 1

    FlightPopulatesCache  = TRUE
    MutantSkipTenantCheck = FALSE

    RequestedTenantOf     <- MCRequestedTenantOf
    AuthenticatedTenantOf <- MCAuthenticatedTenantOf
    QueryOf               <- MCQueryOf
    ClientOf              <- MCClientOf
    ProtocolOf            <- MCProtocolOf
    SecurityContextOf     <- MCSecurityContextOf

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    DeliveredResultIntegrity
    ClaimCheckIntegrity
    SnapshotBound
    ExactlyOnceCommit